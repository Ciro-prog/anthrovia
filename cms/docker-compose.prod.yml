# Producción VPS: solo puerto 60518 (Postgres NO expuesto al host)
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: anthrovia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-anthrovia}
      POSTGRES_DB: anthrovia_cms
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anthrovia -d anthrovia_cms"]
      interval: 5s
      timeout: 5s
      retries: 10

  cms:
    build:
      context: .
      args:
        NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:?Set NEXT_PUBLIC_SERVER_URL e.g. http://pampaservers.com:60518}
        PAYLOAD_PUBLIC_SERVER_URL: ${PAYLOAD_PUBLIC_SERVER_URL:?Set PAYLOAD_PUBLIC_SERVER_URL e.g. http://pampaservers.com:60518}
        NEXT_PUBLIC_PREVIEW_URL: ${PREVIEW_URL:-https://anthroviahr.com}
    restart: unless-stopped
    ports:
      - "60518:3000"
    environment:
      DATABASE_URI: postgresql://anthrovia:${POSTGRES_PASSWORD:-anthrovia}@postgres:5432/anthrovia_cms
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?Set PAYLOAD_SECRET in .env}
      PAYLOAD_PUBLIC_SERVER_URL: ${PAYLOAD_PUBLIC_SERVER_URL:?Set PAYLOAD_PUBLIC_SERVER_URL e.g. http://pampaservers.com:60518}
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:?Set NEXT_PUBLIC_SERVER_URL e.g. http://pampaservers.com:60518}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS with your Vercel domain}
      PREVIEW_URL: ${PREVIEW_URL:-https://anthroviahr.com}
      NEXT_PUBLIC_PREVIEW_URL: ${PREVIEW_URL:-https://anthroviahr.com}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@anthroviahr.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-AnthroviaAdmin2026!}
    volumes:
      - media:/app/media
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  media:
